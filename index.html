<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>memoal studio</title>
<script>
  // ── 屋号設定 ──　配布先の屋号に変更する場合はここだけ書き換えてください
  const SITE_NAME = 'memoal studio';
  const SITE_TAGLINE = 'photo album';
  // ── Worker API ──
  const API = 'https://memoal-portfolio-api.memoal-jp.workers.dev';
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
:root{
  --bg:#f5f2ee;--bg2:#eceae5;--surface:#fff;--text:#231f1b;--text2:#6b6960;
  --accent:#8b7355;--accent2:#c4a882;--border:rgba(0,0,0,.09);--book-bg:#c8c0b8;
  --serif:'Zen Old Mincho',serif;--sans:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-weight:300;}

/* ── ヘッダー ── */
header{padding:36px 6vw 30px;display:flex;align-items:baseline;justify-content:space-between;}
.logo strong{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.04em;}
.logo span{display:block;margin-top:2px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--text2);}

/* ── ギャラリー ── */
#gallery-view{padding:0 6vw 100px;}
.gallery-intro{max-width:640px;margin:0 0 56px;}
.gallery-intro h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:600;line-height:1.5;letter-spacing:.02em;}
.gallery-intro p{margin-top:10px;font-size:13px;color:var(--text2);letter-spacing:.03em;}
#album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:44px 32px;}
.album-card{cursor:pointer;text-decoration:none;color:inherit;display:block;}
.album-card-thumb-wrap{position:relative;width:100%;background:var(--bg2);overflow:hidden;border-radius:2px;display:flex;align-items:center;justify-content:center;min-height:120px;}
.album-card-thumb-wrap img{width:100%;height:auto;max-height:360px;object-fit:contain;display:block;transition:transform .7s cubic-bezier(.16,1,.3,1);}
.album-card:hover .album-card-thumb-wrap img{transform:scale(1.03);}
.album-card-thumb-wrap::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);pointer-events:none;}
.album-card-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:11px;letter-spacing:.1em;}
.album-card-title{margin-top:16px;font-family:var(--serif);font-size:16px;letter-spacing:.03em;}
.album-card-meta{margin-top:4px;font-size:11px;color:var(--text2);letter-spacing:.06em;}
.album-card-ig{display:inline-block;margin-top:6px;font-size:11px;letter-spacing:.05em;color:var(--accent);text-decoration:none;}
.album-card-ig:hover{text-decoration:underline;}
#empty-state,#error-state{display:none;text-align:center;padding:120px 0;color:var(--text2);font-size:13px;letter-spacing:.05em;}

/* ── ビューア ── */
#viewer-view{display:none;flex-direction:column;min-height:100vh;}
#viewer-header{padding:18px 6vw;display:flex;align-items:center;gap:16px;}
#btn-back{background:none;border:1px solid var(--border);border-radius:20px;padding:7px 18px;font-size:12px;letter-spacing:.05em;cursor:pointer;color:var(--text);transition:background .15s;font-family:var(--sans);}
#btn-back:hover{background:var(--bg2);}
#viewer-title{flex:1;font-family:var(--serif);font-size:16px;letter-spacing:.03em;text-align:center;}
#viewer-pageinfo{font-size:11px;color:var(--text2);letter-spacing:.05em;min-width:64px;text-align:right;}
#viewer-meta{display:flex;justify-content:center;align-items:center;gap:14px;padding:0 6vw 14px;font-size:11px;color:var(--text2);letter-spacing:.05em;}
#viewer-meta a{color:var(--accent);text-decoration:none;}
#viewer-meta a:hover{text-decoration:underline;}
#viewer-meta:empty{display:none;}
#viewer-controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 16px 22px;}
#viewer-controls button{background:none;border:1px solid var(--border);border-radius:20px;padding:8px 20px;font-size:12px;letter-spacing:.05em;cursor:pointer;color:var(--text);transition:background .15s;font-family:var(--sans);}
#viewer-controls button:hover:not(:disabled){background:var(--bg2);}
#viewer-controls button:disabled{opacity:.3;cursor:default;}
#book-scene{flex:1;background:var(--book-bg);display:flex;align-items:center;justify-content:center;padding:5vh 4vw;min-height:340px;}
.stf__parent .page{background:#fff;}
#thumb-strip{display:flex;gap:6px;overflow-x:auto;padding:14px 6vw;background:var(--bg);scrollbar-width:thin;}
.vthumb{flex-shrink:0;cursor:pointer;border:1.5px solid transparent;border-radius:3px;overflow:hidden;opacity:.5;transition:opacity .15s,border-color .15s;}
.vthumb:hover{opacity:.8;}
.vthumb.active{border-color:var(--accent);opacity:1;}
.vthumb img{display:block;height:40px;width:auto;}

#loading{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#loading-text{font-size:12px;letter-spacing:.08em;color:var(--text2);}
#loading-bar-wrap{width:180px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
#loading-bar{height:100%;background:var(--accent);width:0%;transition:width .15s;}

footer{padding:40px 6vw 60px;text-align:center;font-size:10px;letter-spacing:.12em;color:var(--text2);text-transform:uppercase;}

@media(max-width:560px){
  header{padding:26px 5vw 22px;}
  #gallery-view{padding:0 5vw 70px;}
  #album-grid{grid-template-columns:1fr;gap:36px;}
  #viewer-title{display:none;}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <strong id="site-name">memoal studio</strong>
    <span id="site-tagline">photo album</span>
  </div>
</header>

<div id="gallery-view">
  <div class="gallery-intro">
    <h1>Albums</h1>
    <p>撮影いただいたアルバムをこちらからご覧いただけます。写真をクリックすると、実際の仕上がりをページをめくりながらご確認いただけます。</p>
  </div>
  <div id="album-grid"></div>
  <div id="empty-state">まだ公開されているアルバムはありません。</div>
  <div id="error-state">アルバムの読み込みに失敗しました。時間をおいて再度お試しください。</div>
</div>

<div id="viewer-view">
  <div id="viewer-header">
    <button id="btn-back">← 一覧に戻る</button>
    <div id="viewer-title"></div>
    <div id="viewer-pageinfo"></div>
  </div>
  <div id="viewer-meta"></div>
  <div id="viewer-controls">
    <button id="btn-first">« 最初</button>
    <button id="btn-prev">← 前へ</button>
    <button id="btn-next">次へ →</button>
    <button id="btn-last">最後 »</button>
  </div>
  <div id="book-scene"><div id="flip-wrap"></div></div>
  <div id="thumb-strip"></div>
</div>

<footer id="site-footer">memoal studio</footer>

<div id="loading">
  <div id="loading-text">読み込み中...</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<script>
document.title = SITE_NAME;
document.getElementById('site-name').textContent = SITE_NAME;
document.getElementById('site-tagline').textContent = SITE_TAGLINE;
document.getElementById('site-footer').textContent = SITE_NAME;

var pageFlip = null;
var currentPages = []; // {img: HTMLImageElement, wide: bool}
var currentAlbum = null;

function showLoading(msg, pct){
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading-bar').style.width = (pct || 0) + '%';
}
function setLoading(msg, pct){
  document.getElementById('loading-text').textContent = msg;
  document.getElementById('loading-bar').style.width = pct + '%';
}
function hideLoading(){
  document.getElementById('loading').style.display = 'none';
}

function driveThumb(id, size){
  return API + '/image/' + id + '?sz=w' + (size || 1600);
}

function loadImage(url, cors){
  return new Promise(function(resolve, reject){
    var img = new Image();
    if(cors) img.crossOrigin = 'anonymous';
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ reject(new Error('image load failed')); };
    img.src = url;
  });
}

// ── ルーティング ──
function route(){
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  if(id){ openAlbum(id); } else { showGallery(); }
}
window.addEventListener('popstate', route);

// ── ギャラリー一覧 ──
async function showGallery(){
  document.getElementById('viewer-view').style.display = 'none';
  document.getElementById('gallery-view').style.display = 'block';
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('error-state').style.display = 'none';
  var grid = document.getElementById('album-grid');
  grid.innerHTML = '';
  try{
    var res = await fetch(API + '/albums');
    var albums = await res.json();
    if(!albums.length){ document.getElementById('empty-state').style.display = 'block'; return; }
    albums.forEach(function(album){
      var a = document.createElement('a');
      a.className = 'album-card';
      a.href = '?id=' + encodeURIComponent(album.id);
      a.onclick = function(e){
        e.preventDefault();
        history.pushState({}, '', '?id=' + encodeURIComponent(album.id));
        openAlbum(album.id);
      };
      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'album-card-thumb-wrap';
      if(album.coverUrl){
        var img = document.createElement('img');
        img.src = album.coverUrl;
        img.loading = 'lazy';
        img.alt = album.title;
        img.onerror = function(){ thumbWrap.innerHTML = '<div class="album-card-noimg">NO IMAGE</div>'; };
        thumbWrap.appendChild(img);
      } else {
        thumbWrap.innerHTML = '<div class="album-card-noimg">NO IMAGE</div>';
      }
      var title = document.createElement('div');
      title.className = 'album-card-title';
      title.textContent = album.title;
      var meta = document.createElement('div');
      meta.className = 'album-card-meta';
      var metaBits = [(album.fileCount || 0) + ' pages'];
      if(album.size) metaBits.push(album.size);
      meta.textContent = metaBits.join(' ・ ');
      a.appendChild(thumbWrap);
      a.appendChild(title);
      a.appendChild(meta);
      if(album.studioUrl){
        var studioLink = document.createElement('a');
        studioLink.className = 'album-card-ig';
        studioLink.href = album.studioUrl;
        studioLink.target = '_blank';
        studioLink.rel = 'noopener';
        studioLink.textContent = (album.studioName || '詳しく見る') + ' ↗';
        studioLink.onclick = function(e){ e.stopPropagation(); };
        a.appendChild(studioLink);
      }
      grid.appendChild(a);
    });
  }catch(err){
    console.error(err);
    document.getElementById('error-state').style.display = 'block';
  }
}

// ── 個別アルバム ──
async function openAlbum(id){
  document.getElementById('gallery-view').style.display = 'none';
  document.getElementById('viewer-view').style.display = 'flex';
  showLoading('アルバムを読み込み中...', 0);
  try{
    var res = await fetch(API + '/albums/' + encodeURIComponent(id));
    if(!res.ok){ hideLoading(); alert('このアルバムは見つかりませんでした。'); history.pushState({}, '', location.pathname); showGallery(); return; }
    var album = await res.json();
    currentAlbum = album;
    document.getElementById('viewer-title').textContent = album.title;
    var metaParts = [];
    if(album.size) metaParts.push('<span>' + album.size.replace(/</g,'&lt;') + '</span>');
    if(album.studioUrl){
      var studioLabel = (album.studioName ? album.studioName.replace(/</g,'&lt;') : '詳しく見る') + ' ↗';
      metaParts.push('<a href="' + album.studioUrl.replace(/"/g,'&quot;') + '" target="_blank" rel="noopener">' + studioLabel + '</a>');
    }
    document.getElementById('viewer-meta').innerHTML = metaParts.join('<span>・</span>');
    var ids = album.pageIds || [];
    if(!ids.length){
      hideLoading();
      alert('このアルバムはまだページ画像が登録されていません。');
      history.pushState({}, '', location.pathname);
      showGallery();
      return;
    }
    var loaded = 0;
    var results = new Array(ids.length);
    await Promise.all(ids.map(function(id, i){
      return loadImage(driveThumb(id, 1600), true).then(function(img){
        results[i] = imgToCanvas(img);
      }).catch(function(e){
        console.error('page load failed', id, e);
      }).finally(function(){
        loaded++;
        setLoading('写真を読み込み中… ' + loaded + ' / ' + ids.length, (loaded / ids.length) * 100);
      });
    }));
    var canvases = results.filter(function(c){ return !!c; });
    hideLoading();
    if(!canvases.length){ alert('写真の読み込みに失敗しました。'); showGallery(); return; }
    requestAnimationFrame(function(){requestAnimationFrame(function(){initFlipBook(canvases);});});
  }catch(err){
    hideLoading();
    console.error(err);
    alert('アルバムの読み込みに失敗しました。');
    history.pushState({}, '', location.pathname);
    showGallery();
  }
}

function imgToCanvas(img){
  var c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}

function isWide(c){ return c.width / c.height > 1.3; }

function splitCanvas(c, side){
  var hw = Math.floor(c.width / 2);
  var out = document.createElement('canvas');
  if(side === 'L'){
    out.width = hw; out.height = c.height;
    out.getContext('2d').drawImage(c, 0, 0, hw, c.height, 0, 0, hw, c.height);
  } else {
    var rw = c.width - hw;
    out.width = rw; out.height = c.height;
    out.getContext('2d').drawImage(c, hw, 0, rw, c.height, 0, 0, rw, c.height);
  }
  return out;
}

function buildItems(raws){
  var items = [], backCover = null;
  raws.forEach(function(c, fi){
    if(isWide(c)){
      if(fi === 0){
        items.push({canvas: splitCanvas(c, 'R'), srcIdx: fi, isCover: true});
        backCover = {canvas: splitCanvas(c, 'L'), srcIdx: fi, isBackCover: true};
      } else {
        items.push({canvas: splitCanvas(c, 'L'), srcIdx: fi});
        items.push({canvas: splitCanvas(c, 'R'), srcIdx: fi});
      }
    } else {
      items.push({canvas: c, srcIdx: fi});
    }
  });
  if(backCover) items.push(backCover);
  return items;
}

var flipItems = [];

function initFlipBook(raws){
  try{
    if(pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip = null; }
    flipItems = buildItems(raws);
    var scene = document.getElementById('book-scene');
    var sceneW = Math.max(scene.clientWidth, window.innerWidth || 800) - 32;
    if(sceneW < 200) sceneW = (window.innerWidth || 600) - 32;
    var maxH = Math.min(560, Math.max(300, window.innerHeight - 260));
    var firstC = flipItems[0].canvas;
    var aspect = firstC.width / firstC.height;
    var ph = Math.min(maxH, (sceneW / 2) / aspect);
    var pw = Math.floor(ph * aspect);
    if(pw * 2 > sceneW){ pw = Math.floor(sceneW / 2); ph = Math.floor(pw / aspect); }
    if(pw < 60){ pw = 60; ph = Math.floor(pw / aspect); }

    var oldScene = document.getElementById('book-scene');
    var newScene = document.createElement('div'); newScene.id = 'book-scene';
    var fw = document.createElement('div'); fw.id = 'flip-wrap';
    newScene.appendChild(fw);
    oldScene.parentNode.replaceChild(newScene, oldScene);
    fw.style.width = (pw * 2) + 'px'; fw.style.height = ph + 'px';

    var els = flipItems.map(function(item, pi){
      var div = document.createElement('div');
      div.style.cssText = 'width:' + pw + 'px;height:' + ph + 'px;overflow:hidden;background:#fff;position:relative;';
      var src = item.canvas;
      var scaleW = pw / src.width, scaleH = ph / src.height;
      var scale = Math.max(scaleW, scaleH);
      var dw = Math.round(src.width * scale), dh = Math.round(src.height * scale);
      var ox = Math.round((pw - dw) / 2), oy = Math.round((ph - dh) / 2);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var resized = document.createElement('canvas');
      resized.width = Math.round(pw * dpr); resized.height = Math.round(ph * dpr);
      var rctx = resized.getContext('2d');
      rctx.imageSmoothingEnabled = true; rctx.imageSmoothingQuality = 'high'; rctx.scale(dpr, dpr);
      rctx.drawImage(src, 0, 0, src.width, src.height, ox, oy, dw, dh);

      var shadowW = Math.round(pw * 0.07);
      var isRightPage = (pi === 0) || (pi % 2 === 0 && pi !== 0);
      var grad;
      if(isRightPage){
        grad = rctx.createLinearGradient(0, 0, shadowW, 0);
        grad.addColorStop(0, 'rgba(0,0,0,0.28)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
        rctx.fillStyle = grad; rctx.fillRect(0, 0, shadowW, ph);
      } else {
        grad = rctx.createLinearGradient(pw, 0, pw - shadowW, 0);
        grad.addColorStop(0, 'rgba(0,0,0,0.28)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
        rctx.fillStyle = grad; rctx.fillRect(pw - shadowW, 0, shadowW, ph);
      }

      var im = document.createElement('img');
      im.style.cssText = 'width:100%;height:100%;display:block;';
      im.src = resized.toDataURL('image/jpeg', 0.92);
      div.appendChild(im);
      if(item.isCover || item.isBackCover) div.setAttribute('data-density', 'hard');
      return div;
    });

    pageFlip = new St.PageFlip(fw, {
      width: pw, height: ph, size: 'fixed',
      drawShadow: true, flippingTime: 700, usePortrait: false,
      showCover: true, mobileScrollSupport: true, maxShadowOpacity: 0.3,
      showPageCorners: true, disableFlipByClick: false, autoSize: false, startZIndex: 0
    });
    pageFlip.loadFromHTML(els);
    pageFlip.on('flip', function(e){ try{ updateUI(e.data); }catch(err){} });
    pageFlip.on('changeState', function(){ try{ updateUI(pageFlip.getCurrentPageIndex()); }catch(e){} });
    buildThumbs(raws);
    updateUI(0);
  }catch(err){ console.error(err); }
}

function buildThumbs(raws){
  var strip = document.getElementById('thumb-strip');
  strip.innerHTML = '';
  raws.forEach(function(c, fi){
    var startPage = 0;
    for(var i = 0; i < flipItems.length; i++){
      if(flipItems[i].srcIdx === fi && !flipItems[i].isBackCover){ startPage = i; break; }
    }
    var th = document.createElement('div');
    th.className = 'vthumb' + (fi === 0 ? ' active' : '');
    th.dataset.srcIdx = fi;
    th.onclick = (function(idx){ return function(){ if(pageFlip) pageFlip.flip(idx); }; })(startPage);
    var th_h = 40, th_w = Math.round(c.width / c.height * th_h);
    var tc = document.createElement('canvas');
    tc.width = th_w; tc.height = th_h;
    tc.getContext('2d').drawImage(c, 0, 0, c.width, c.height, 0, 0, th_w, th_h);
    var tim = document.createElement('img');
    tim.src = tc.toDataURL('image/jpeg', 0.8);
    th.appendChild(tim);
    strip.appendChild(th);
  });
}

function updateUI(idx){
  if(!pageFlip) return;
  var total = flipItems.length;
  document.getElementById('viewer-pageinfo').textContent = (idx + 1) + ' / ' + total;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx >= total - 2;
  var item = flipItems[idx] || flipItems[0];
  document.querySelectorAll('.vthumb').forEach(function(t){
    var i = parseInt(t.dataset.srcIdx);
    t.classList.toggle('active', i === item.srcIdx);
    if(i === item.srcIdx) t.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'});
  });
}

document.getElementById('btn-back').addEventListener('click', function(){
  history.pushState({}, '', location.pathname);
  if(pageFlip){ try{ pageFlip.destroy(); }catch(e){} pageFlip = null; }
  var fw=document.getElementById('flip-wrap'); if(fw) fw.innerHTML = '';
  var ts=document.getElementById('thumb-strip'); if(ts) ts.innerHTML = '';
  showGallery();
});
document.getElementById('btn-prev').addEventListener('click', function(){ if(pageFlip) pageFlip.flipPrev('top'); });
document.getElementById('btn-next').addEventListener('click', function(){ if(pageFlip) pageFlip.flipNext('top'); });
document.getElementById('btn-first').addEventListener('click', function(){ if(pageFlip) pageFlip.flip(0); });
document.getElementById('btn-last').addEventListener('click', function(){ if(pageFlip) pageFlip.flip(flipItems.length - 1); });
document.addEventListener('keydown', function(e){
  if(document.getElementById('viewer-view').style.display === 'none') return;
  if(e.key === 'ArrowLeft') pageFlip && pageFlip.flipPrev('top');
  if(e.key === 'ArrowRight') pageFlip && pageFlip.flipNext('top');
});

route();
</script>
</body>
</html>
